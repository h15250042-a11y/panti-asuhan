<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFDF9" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rumah_bersinar_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', '#16100a');
          }
        } catch (e) {}
      })();
    </script>
    <title>Yayasan Rumah Bersinar | A home to grow. A community to belong.</title>
    <meta name="description" content="Official website of Yayasan Rumah Bersinar (Est. 2019): A home to grow. A community to belong. Guiding 4 orphanage homes in Surabaya & Sidoarjo for underprivileged children from remote 3T regions." />
    <meta property="og:title" content="Yayasan Rumah Bersinar | A home to grow. A community to belong." />
    <meta property="og:description" content="Official website of Yayasan Rumah Bersinar (Est. 2019): A home to grow. A community to belong. Guiding 4 orphanage homes in Surabaya & Sidoarjo for underprivileged children from remote 3T regions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
